name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to Docker Hub"
        required: true
        type: boolean
        default: true

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Package version: ${VERSION}"

      - name: Resolve Docker Hub Target Image
        id: docker_meta_calc
        env:
          CUSTOM_REPO: ${{ vars.DOCKERHUB_REPOSITORY }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || 'tbdavid2019' }}
        run: |
          if [ -n "$CUSTOM_REPO" ]; then
            IMAGE_NAME="$CUSTOM_REPO"
          else
            IMAGE_NAME="${DH_USER}/888box"
          fi
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Target image: ${IMAGE_NAME}"

      - name: Set up QEMU (Multi-platform emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'linux/amd64,linux/arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.push_image) && (secrets.DOCKERHUB_USERNAME != '' || secrets.DOCKER_USERNAME != '') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_PASSWORD }}

      - name: Docker Metadata & Tags Extraction
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.docker_meta_calc.outputs.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.pkg_version.outputs.version }},enable=true
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=888box
            org.opencontainers.image.description=888box - Unified Asset Management & Media Hosting Platform
            org.opencontainers.image.version=${{ steps.pkg_version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.event_name != 'workflow_dispatch' || inputs.push_image) && (secrets.DOCKERHUB_USERNAME != '' || secrets.DOCKER_USERNAME != '') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
