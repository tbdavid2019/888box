name: Auto Deploy to Production Hosts

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  lint-check:
    name: Fast Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, curl, gd, mbstring, dom, fileinfo
          coverage: none

      - name: PHP Syntax Check
        run: |
          echo "🔍 Checking PHP syntax before deployment..."
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

  deploy:
    name: Deploy to ${{ matrix.host.name }}
    needs: lint-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - name: "box.aiurl.tw"
            ssh_host: "llm.5gao.ai"
            ssh_user: "ec2-user"
            app_dir: "/home/ec2-user/box.aiurl.tw"
          - name: "box.david888.com"
            ssh_host: "34.80.178.194"
            ssh_user: "david"
            app_dir: "/home/david/888box"
          - name: "box.fanpokka.ai"
            ssh_host: "office.fanpokka.ai"
            ssh_user: "ec2-user"
            app_dir: "/home/ec2-user/PixPro"
          - name: "box.glsoft.ai"
            ssh_host: "webglsoft.com"
            ssh_user: "david"
            app_dir: "/home/david/888box"

    steps:
      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to ${{ matrix.host.name }}
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${{ matrix.host.ssh_user }}@${{ matrix.host.ssh_host }} << 'EOF'
            set -e
            echo "🚀 [$(date '+%Y-%m-%d %H:%M:%S')] Starting deployment on ${{ matrix.host.name }}..."
            cd ${{ matrix.host.app_dir }}
            
            echo "📥 Pulling latest main branch..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "📦 Syncing code into 888box container..."
            docker cp admin/ 888box:/var/www/html/
            docker cp config/ 888box:/var/www/html/
            docker cp static/ 888box:/var/www/html/
            docker cp api.php 888box:/var/www/html/
            docker cp api_report.php 888box:/var/www/html/
            docker cp api_file.php 888box:/var/www/html/ 2>/dev/null || true
            docker cp index.php 888box:/var/www/html/
            docker cp view.php 888box:/var/www/html/
            docker cp video.php 888box:/var/www/html/ 2>/dev/null || true
            docker cp audio.php 888box:/var/www/html/ 2>/dev/null || true
            docker cp mcp.php 888box:/var/www/html/ 2>/dev/null || true
            docker cp skill.php 888box:/var/www/html/ 2>/dev/null || true
            docker cp llms.php 888box:/var/www/html/ 2>/dev/null || true
            
            echo "🧪 Verifying container PHP syntax..."
            docker exec 888box php -l /var/www/html/admin/settings.php
            docker exec 888box php -l /var/www/html/config/mail.php
            
            echo "🩺 Verifying local HTTP endpoint..."
            curl -s -o /dev/null -w "HTTP Response: %{http_code}\n" http://127.0.0.1:6767/ || true
            
            echo "✅ Successfully deployed ${{ matrix.host.name }}!"
          EOF
